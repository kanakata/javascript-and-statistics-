<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/app.css" />
    <script src="../javascript/app/standard-calculator.js" type="module" async></script>
    <script src="../javascript/app/app.js" defer></script>
  </head>
  <body>
    <div class="standard-calculator">
      <main>
        <div class="display">
          <div class="expression-display">
            <span class="meta">expression</span>
            <span class="expression"></span>
          </div>
          <div class="result-display">
            <span class="meta">value</span>
            <span class="result"></span>
          </div>
        </div>
        <div class="inputs">
          <div data-value="%" class="input">%</div>
          <div data-value="CE" class="input">CE</div>
          <div data-value="C" class="input">C</div>
          <div data-value="del" class="input">
            <img src="../assets/clear.png" alt="clear-input" />
          </div>
          <div data-value="root" class="input">x½</div>
          <div data-value="pow" class="input">x&sup2;</div>
          <div data-value="fact" class="input">x!</div>
          <div data-value="/" class="input">&divide;</div>
          <div data-value="7" class="input num">7</div>
          <div data-value="8" class="input num">8</div>
          <div data-value="9" class="input num">9</div>
          <div data-value="*" class="input">&times;</div>
          <div data-value="4" class="input num">4</div>
          <div data-value="5" class="input num">5</div>
          <div data-value="6" class="input num">6</div>
          <div data-value="-" class="input">-</div>
          <div data-value="1" class="input num">1</div>
          <div data-value="2" class="input num">2</div>
          <div data-value="3" class="input num">3</div>
          <div data-value="+" class="input">+</div>
          <div data-value="" class="input num"></div>
          <div data-value="0" class="input num">0</div>
          <div data-value="." class="input num">.</div>
          <div data-value="=" class="input num">=</div>
        </div>
      </main>
    </div>
  </body>
</html>
