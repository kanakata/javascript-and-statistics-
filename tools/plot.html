<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stathematics-plot</title>
    <link rel="stylesheet" href="../css/app.css" />
    <style></style>
    <script src="../javascript/plot/plt.js"></script>
    <script src="../javascript/qualitative-analysis/descriptive-statistics/non-grouped-data.js"></script>
  </head>
  <body>
    <main>
      <div class="graph">
        <canvas id="canvas"></canvas>
      </div>
      <div class="data">
        <button onclick="window.history.back()">Back</button>
        <button onclick="dialog()">Add Data</button>
        <h1>Your Data Summary</h1>
        <ol></ol>
      </div>
    </main>

    <template id="data-form-template">
      <form class="data-form">
        <button type="submit" onclick="ungrouped_process()">Submit</button>
        <button type="button" onclick="close_dialog()">close</button>
      </form>
    </template>

    <template id="data-length-template">
      <form class="data-form">
        <label for="length">Length:</label>
        <input type="number" id="length" name="length" required />
        <button type="submit" onclick="ungrouped_proceed()">Submit</button>
      </form>
    </template>

    <script>
      window.addEventListener('load', () => {
        data_summary();
        plot(document.getElementById('canvas'));
      });

      function dialog() {
        const dialog_box = document.createElement('div');
        const options = ['grouped data', 'ungrouped data', 'close'];
        options.forEach((Option) => {
          let dialog = document.createElement('button');
          dialog.textContent = Option;
          switch (Option) {
            case 'close':
              dialog.setAttribute('onclick', 'close_dialog()');
              dialog.setAttribute('class', 'close');
              break;
            case 'ungrouped data':
              dialog.setAttribute('onclick', 'ungrouped_form()');
              break;
          }

          dialog_box.appendChild(dialog);
        });
        dialog_box.setAttribute('class', 'dialog open');
        document.body.appendChild(dialog_box);
      }

      function length(parent) {
        const length = document.createElement('input');
        length.setAttribute('placeholder', 'length');
        length.setAttribute('type', 'number');
        length.setAttribute('id', 'ungrouped-length');
        parent.appendChild(length);
        const submit = document.createElement('button');
        submit.textContent = 'submit length';
        submit.setAttribute('onclick', 'ungrouped_proceed()');
        parent.appendChild(submit);
      }

      function ungrouped_form() {
        document.querySelector('.dialog').remove();
        const form_holder = document
          .getElementById('data-length-template')
          .content.cloneNode(true);
        document.body.appendChild(form_holder);
      }

      function close_dialog() {
        document.querySelector('.data-form').remove();
      }

      function ungrouped_proceed() {
        const length = document.getElementById('length').value;
        document.querySelector('.data-form').remove();
        const form_holder = document
          .getElementById('data-form-template')
          .content.cloneNode(true);
        for (let i = 0; i < length; i++) {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.setAttribute('placeholder', `data ${length - i}`);
          input.setAttribute('type', 'number');
          const color = document.createElement('input');
          color.setAttribute('type', 'color');
          const label_text = document.createElement('input');
          label_text.setAttribute('placeholder', `label ${length - i}`);
          label_text.setAttribute('type', 'text');

          label.appendChild(color);
          label.appendChild(input);
          label.appendChild(label_text);
          form_holder.querySelector('.data-form').prepend(label);
        }
        document.body.appendChild(form_holder);
      }

      function close_dialog() {
        document.querySelector('.dialog').remove();
      }

      function plot(graph, data, labels, colors) {
        const canvas = graph ?? document.getElementById('canvas');
        const plt = new Plt(canvas, {
          type: 'bar',
          data: data ?? [97, 80, 91, 87, 86, 93, 84, 81],
          bar_colors: colors ?? [
            'lightblue',
            'lightgreen',
            'lightyellow',
            'white',
            'grey',
            'orange',
            'red',
            'green',
          ],
          data_labels: labels ?? [
            'math',
            'kis',
            'phy',
            'eng',
            'bus',
            'chem',
            'geo',
            'bio',
          ],
          yScale: 10,
          grid: true,
        });
      }

      function ungrouped_process() {
        document.getElementById('canvas').remove();
        const data = [];
        const colors = [];
        const labels = [];
        const inputs = document.querySelectorAll(
          '.data-form input[type="number"]'
        );
        const color_inputs = document.querySelectorAll(
          '.data-form input[type="color"]'
        );

        const label_inputs = document.querySelectorAll(
          '.data-form input[type="text"]'
        );

        inputs.forEach((input) => {
          data.push(Number(input.value));
        });

        color_inputs.forEach((color_input) => {
          colors.push(color_input.value);
        });

        label_inputs.forEach((label) => {
          labels.push(label.value);
        });

        const canvas = document.createElement('canvas');
        canvas.setAttribute('id', 'canvas');
        document.body.appendChild(canvas);
        plot(canvas, data, labels, colors);

        close_dialog();
      }

      function data_summary() {
        const statistics = new NonGrouped([97, 80, 91, 87, 86, 93, 84, 81]);
        const data_area = document.querySelector('.data ol');

        const data = [
          statistics.arithmeticMean(),
          statistics.geometricMean(),
          statistics.harmonicMean(),
          statistics.median(),
          statistics.mode(),
          statistics.range(),
          statistics.variance(),
          statistics.standardDeviation(),
        ];

        const li_labels = [
          'Arithmetic Mean: ',
          'Geometric Mean: ',
          'Harmonic Mean: ',
          'Median: ',
          'Mode: ',
          'Range: ',
          'Variance: ',
          'Standard Deviation: ',
        ];

        for (let i = 0; i < data.length; i++) {
          let list = document.createElement('li');
          list.textContent = li_labels[i] + data[i];
          data_area.appendChild(list);
        }
      }
    </script>
  </body>
</html>
