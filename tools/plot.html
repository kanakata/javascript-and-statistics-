<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        height: 100vh;
        width: 100%;
        display: flex;
        & .graph {
          width: 70%;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          & #canvas {
            border: 1px solid black;
          }
        }
        & .data {
          width: 30%;
          & ol {
            padding-left: 20px;
            & li {
              font-size: 18px;
            }
          }
        }
      }
      .dialogue {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="../javascript/plot/plt.js"></script>
    <script src="../javascript/statistics/non-grouped-data.js"></script>
  </head>
  <body>
    <main>
      <div class="graph">
        <canvas id="canvas"></canvas>
      </div>
      <div class="data">
        <button id="add-data">Add Data</button>
        <h1>Data Summary</h1>
        <ol></ol>
      </div>
    </main>
    <script>
      document.getElementById('add-data').addEventListener('click', () => {
        dialogue();
      });

      function dialogue() {
        const dialogue_box = document.createElement('div');
        const options = ['grouped data', 'ungrouped data'];
        options.forEach((Option) => {
          let dialogue = document.createElement('button');
          dialogue.textContent = Option;
          dialogue_box.appendChild(dialogue);
        });
        dialogue_box.setAttribute('class', 'dialogue');
        document.body.appendChild(dialogue_box);
      }
      const canvas = document.getElementById('canvas');
      const data_area = document.querySelector('.data ol');
      const plt = new Plt(canvas, {
        type: 'bar',
        data: [97, 80, 91, 87, 86, 93, 84, 81],
        // bar_colors: ['lightblue', 'lightgreen', "lightyellow", "white", "grey", "orange", "red", "green"],
        data_labels: ['math', 'kis', 'phy', 'eng', 'bus', 'chem', 'geo', 'bio'],
        // data: [97, 80, 91],
        // data_labels: ['math', 'kis', 'phy'],
        yScale: 10,
        grid: true
      });

      const statistics = new Statistics([97, 80, 91, 87, 86, 93, 84, 81]);
      const data = [
        statistics.arithmeticMean(),
        statistics.geometricMean(),
        statistics.harmonicMean(),
        statistics.median(),
        statistics.mode(),
        statistics.range(),
        statistics.variance(),
        statistics.standardDeviation(),
      ];

      const li_labels = [
        'Arithmetic Mean: ',
        'Geometric Mean: ',
        'Harmonic Mean: ',
        'Median: ',
        'Mode: ',
        'Range: ',
        'Variance: ',
        'Standard Deviation: ',
      ];

      for (let i = 0; i < data.length; i++) {
        let list = document.createElement('li');
        list.textContent = li_labels[i] + data[i];
        data_area.appendChild(list);
      }
    </script>
  </body>
</html>
