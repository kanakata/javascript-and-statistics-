<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/app.css" />
    <script src="../js/binary-calculator.js" type="module" async></script>
    <script src="../js/app.js" type="module" async></script>
  </head>
  <body>
    <div class="binary-calculator">
      <main>
        <div class="display">
          <div class="expression-display">
            <div class="meta">expression</div>
            <div class="expression"></div>
          </div>
          <div class="result-display">
            <div class="meta">value</div>
            <div class="result"></div>
          </div>
        </div>
        <div class="inputs">
          <div class="input">A</div>
          <div class="input">CE</div>
          <div class="input">C</div>
          <div class="input">&times;</div>
          <div class="input">B</div>
          <div class="input">x&sup2;</div>
          <div class="input"></div>
          <div class="input">&divide;</div>
          <div class="input num">C</div>
          <div class="input num">8</div>
          <div class="input num">9</div>
          <div class="input">&times;</div>
          <div class="input num">D</div>
          <div class="input num">5</div>
          <div class="input num">6</div>
          <div class="input">-</div>
          <div class="input num">E</div>
          <div class="input num">2</div>
          <div class="input num">3</div>
          <div class="input">+</div>
          <div class="input num">F</div>
          <div class="input num">0</div>
          <div class="input num">.</div>
          <div class="input">=</div>
        </div>
      </main>
      <aside></aside>
    </div>
  </body>
</html>
