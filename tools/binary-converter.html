<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        input[type="text"] {
            padding: 10px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        h2 {
            margin-top: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Binary Converter</h1>
    <input type="text" id="decimalInput" placeholder="Enter decimal number">
    <button id="convertButton">Convert to Binary</button>
    <h2>Binary Output:</h2>
    <p id="binaryOutput"></p>
    <script src="../javascript/app/binary-converter.js"></script>
</body>
</html>
