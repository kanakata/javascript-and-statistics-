<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/app.css" />
    <style>
      body {
        margin: 0px;
        padding: 0px;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="../javascript/graphs/graph.js"></script>
    <script src="../javascript/statistics/non-grouped-data.js"></script>
  </head>
  <body>
    <main>
      <div class="graph">
        <canvas id="canvas"></canvas>
      </div>
      <div class="data">
        <button onclick="window.location.href = '/'">Back</button>
        <button onclick="dialog()">Enter Equation</button>
        <ol></ol>
      </div>
    </main>
    <script>
      window.addEventListener('load', () => {
        plot();
      });
      function dialog() {
        const dialog_box = document.createElement('div');
        const options = ['equation',];
        options.forEach((Option) => {
          let dialog = document.createElement('button');
          dialog.textContent = Option;
          dialog_box.appendChild(dialog);
        });
        dialog_box.setAttribute('class', 'dialog');
        document.body.appendChild(dialog_box);
      }
      function plot() {
        const canvas = document.getElementById('canvas');
        const data_area = document.querySelector('.data ol');
        const graph = new Graph(canvas, {});
      }
    </script>
  </body>
</html>
