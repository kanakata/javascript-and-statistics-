<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        height: 100vh;
        width: 100%;
        display: flex;
        & .graph {
          width: 70%;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          & #canvas {
            border: 1px solid black;
          }
        }
        & .data {
          width: 30%;
          & ol {
            padding-left: 20px;
            & li {
              font-size: 18px;
            }
          }
        }
      }
      .dialogue {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="../javascript/graphs/graph.js"></script>
    <script src="../javascript/statistics/non-grouped-data.js"></script>
  </head>
  <body>
    <main>
      <div class="graph">
        <canvas id="canvas"></canvas>
      </div>
      <div class="data">
        <button id="add-data">Add Data</button>
        <h1>Data Summary</h1>
        <ol></ol>
      </div>
    </main>
    <script>
      document.getElementById('add-data').addEventListener('click', () => {
        dialogue();
      });

      function dialogue() {
        const dialogue_box = document.createElement('div');
        const options = ['grouped data', 'ungrouped data'];
        options.forEach((Option) => {
          let dialogue = document.createElement('button');
          dialogue.textContent = Option;
          dialogue_box.appendChild(dialogue);
        });
        dialogue_box.setAttribute('class', 'dialogue');
        document.body.appendChild(dialogue_box);
      }
      const canvas = document.getElementById('canvas');
      const data_area = document.querySelector('.data ol');
      const graph = new Graph(canvas, {});
    </script>
  </body>
</html>
